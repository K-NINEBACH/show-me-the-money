<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>내 돈 챙겨줘</title>
    <meta name="description" content="급여일 기준으로 지출을 관리하는 개인 가계부" />
    <meta name="theme-color" content="#161B2E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- 예전엔 이 폰트를 컴포넌트 안 <style>에서 @import로 불러왔는데, 그러면
         브라우저가 JS를 실행해서 React가 마운트된 다음에야 폰트 요청을 시작함.
         여기 head에 두면 HTML을 읽는 즉시(스크립트 실행 전부터) 요청이 나가서
         글씨가 기본폰트→실제폰트로 바뀌는 지연이 줄어듦. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 굵기는 실제 코드에서 쓰는 것만 받음(2026-08-23 정리): Noto Serif KR은
         거의 전부 700(굵게)만 쓰고 500은 안 씀. IBM Plex Mono(금액 숫자용)는
         600·700만 쓰고 500은 안 씀 — 예전엔 반대로 안 쓰는 500은 받고, 실제
         쓰는 700은 안 받아서 숫자가 의도한 굵기보다 살짝 얇게 나오고 있었음. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=IBM+Plex+Mono:wght@600;700&display=swap" />
    <style>
      * { box-sizing: border-box; }
      input, select { font-family: inherit; }
      ::-webkit-scrollbar { display: none; }

      /* 한글은 단어 중간에서 줄을 바꾸지 않는다 — '할부(고정지출)'이 '고정지/출'로
         잘리던 것. 너무 긴 한 덩어리만 어쩔 수 없이 끊는다. */
      body { word-break: keep-all; overflow-wrap: break-word; }

      /* 지금 어느 칸·버튼에 있는지. 색은 테마가 --focus로 넣어 준다(theme.js).
         예전엔 입력칸이 outline:none만 하고 대신할 표시가 없었다. */
      :focus-visible { outline: 2px solid var(--focus, currentColor); outline-offset: 2px; }
      input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 1px; }

      /* 누르면 살짝 눌린다 — 버튼이 눌렸다는 손맛. 값은 better-ui 그대로(0.96, 150ms).
         움직임 줄이기를 켠 사람에겐 아예 안 건다(opt-in). */
      @media (prefers-reduced-motion: no-preference) {
        button { transition-property: scale; transition-duration: 150ms; transition-timing-function: ease-out; }
        button:active:not(:disabled) { scale: 0.96; }
      }

      /* 움직임 줄이기를 켠 사람에겐 인라인에 박힌 전환(게이지 링 등)도 끈다. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
